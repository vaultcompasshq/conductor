name: pr-comment-smoke

# Throwaway smoke for the opt-in PR-comment surface. Runs the local action
# with pr-comment: true on a pull request and confirms it posts a report
# comment. Not a permanent workflow; the smoke branch and PR are deleted
# after the check.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - uses: ./
        with:
          pr-comment: true
        continue-on-error: true
